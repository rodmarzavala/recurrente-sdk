name: OpenSSF Scorecard

# Required by ossf/scorecard-action: this workflow must ONLY contain the
# Scorecard job with id-token: write. Having other jobs with id-token
# in the same file causes a 400 verification failure.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1" # Weekly — every Monday 08:00 UTC

permissions:
  contents: read

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard.sarif
