name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"    # e.g. v0.2.0
      - "v[0-9]+.[0-9]+.[0-9]+-*"  # e.g. v1.0.0-rc.1

# Permissions for npm provenance (SLSA Level 2)
permissions:
  contents: write  # create GitHub Release
  id-token:  write # npm publish --provenance

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for release notes

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies (no scripts)
        run: npm ci --ignore-scripts

      # ── Quality gates — must all pass before publishing ──────────────────

      - name: TypeScript — strict check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=moderate --omit=dev

      - name: Build
        run: npm run build

      - name: Verify dist
        run: |
          test -f dist/index.js  || (echo "Missing dist/index.js"  && exit 1)
          test -f dist/index.d.ts || (echo "Missing dist/index.d.ts" && exit 1)

      # ── Publish ───────────────────────────────────────────────────────────

      - name: Check if version already exists on npm
        id: version_check
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "${PKG}@${VER}" version &>/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "⚠️  ${PKG}@${VER} already published — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "✓ ${PKG}@${VER} not yet published — proceeding."
          fi

      - name: Publish to npm (with SLSA provenance)
        if: steps.version_check.outputs.exists == 'false'
        run: npm publish --access public --provenance

      # ── GitHub Release ────────────────────────────────────────────────────

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
