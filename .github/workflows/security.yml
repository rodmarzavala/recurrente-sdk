name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1" # Weekly — every Monday at 08:00 UTC

# Minimal, explicit permissions
permissions:
  contents: read

jobs:
  # ── 1. npm audit ──────────────────────────────────────────────────────────
  audit:
    name: npm audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies (no scripts)
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        # Fail only if moderate+ severity vulnerabilities are found.
        # Dev-only vulnerabilities still show up but don't block the build.
        run: npm audit --audit-level=moderate --omit=dev

      - name: Audit all dependencies (informational)
        run: npm audit || true

  # ── 2. Dependency review (PR only) ────────────────────────────────────────
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write # allows the action to post a comment on the PR

    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Block PRs that introduce moderate+ CVEs in any dependency
          fail-on-severity: moderate
          # Comment on the PR with a summary of changes
          comment-summary-in-pr: always

  # ── 3. CodeQL static analysis ─────────────────────────────────────────────
  codeql:
    name: CodeQL (TypeScript)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: typescript
          # Enable additional security queries beyond the defaults
          queries: security-extended, security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:typescript"

  # ── 4. OpenSSF Scorecard ──────────────────────────────────────────────────
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      security-events: write
      id-token: write # Required to publish Scorecard results

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # security best practice

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard.sarif
