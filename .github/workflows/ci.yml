name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal permissions — principle of least privilege
permissions:
  contents: read

jobs:
  test:
    name: Typecheck · Test · Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["18.x", "20.x", "22.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts   # --ignore-scripts prevents postinstall supply-chain attacks

      - name: TypeScript — strict check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (verify dist compiles)
        run: npm run build

      - name: Verify published files
        run: |
          # Ensure dist/ was created and contains expected exports
          test -f dist/index.js || (echo "dist/index.js missing" && exit 1)
          test -f dist/index.d.ts || (echo "dist/index.d.ts missing" && exit 1)
